name: Trim v0.1.4 release notes
on:
  push:
    branches: [main]
    paths: [.github/workflows/trim-v014-notes.yml]
concurrency:
  group: flowgesture-release-v0.1.4
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  trim-notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/AaronJny/flowgesture/releases/439301684 > before.json
          python3 - <<'PY_CHECK'
          import hashlib, json
          r = json.load(open('before.json'))
          assert r['id'] == 439301684 and r['tag_name'] == 'v0.1.4'
          assert r['target_commitish'] == '8244054c7682c24ed17f7a59e039e8c254f6fe9e'
          assert not r['draft'] and not r['prerelease']
          assert hashlib.sha256(r['body'].encode()).hexdigest() == '6be0508730d5fb73a3810f831b6aea7db3dc288b1cf6e6effe12e00dab3cc808', 'Release notes changed; stop before editing.'
          PY_CHECK
          cat > notes.md <<'NOTES'
          ## 行云手势 0.1.4
          - 修复切换应用后首次触控手势丢失，改善快速多指手势识别和设备启动失败后的恢复。
          - 修复 Intel 上自由形状预览崩溃，以及小屏幕上保存按钮不可见的问题。

          ## FlowGesture 0.1.4
          - Fix the first touch gesture being lost after switching apps; improve quick multi-finger recognition and recovery from device-start failures.
          - Fix the Intel free-form preview crash and keep Save accessible on small displays.
          NOTES
          jq -n --rawfile body notes.md '{body: $body}' > patch.json
          gh api --method PATCH repos/AaronJny/flowgesture/releases/439301684 --input patch.json > after.json
          python3 - <<'PY_CHECK'
          import json
          before = json.load(open('before.json'))
          after = json.load(open('after.json'))
          assert after['body'] == open('notes.md').read()
          for key in ['id', 'tag_name', 'target_commitish', 'name', 'draft', 'prerelease', 'published_at']:
              assert before[key] == after[key], key
          keys = ['id', 'name', 'size', 'digest', 'browser_download_url']
          assets = lambda r: sorted([{k: a[k] for k in keys} for a in r['assets']], key=lambda a: a['id'])
          assert assets(before) == assets(after), 'Release assets changed.'
          print('Release notes shortened. Version, title and download assets unchanged.')
          PY_CHECK
