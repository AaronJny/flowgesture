name: Publish verified release
on:
  push:
    branches: [main]
    paths: [releases/v0.1.4.json]
  workflow_dispatch:
concurrency:
  group: flowgesture-release-v0.1.4
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: AaronJny/flowgesture
      VERSION: v0.1.4
      TARGET: 8244054c7682c24ed17f7a59e039e8c254f6fe9e
      VERIFIED_RUN: '42643483999'
      ARTIFACT_NAME: FlowGesture-macos-macos-15
      DMG_SHA256: 0c7a1e42e1685296168b69b287eaaa71583370350cc0cc5764092133b7c96355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8244054c7682c24ed17f7a59e039e8c254f6fe9e
          persist-credentials: false
      - name: Check verified source and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "$GH_REPO"
          test "$(git rev-parse HEAD)" = "$TARGET"
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > verified-run.json
          jq -e '.head_sha == env.TARGET and .status == "completed" and .conclusion == "success" and .event == "push" and .path == ".github/workflows/ci.yml"' verified-run.json
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN/jobs?per_page=100" > verified-jobs.json
          jq -e '.total_count == 3 and ([.jobs[].name] | sort) == ["build (macos-15)", "build (macos-15-intel)", "build (macos-26)"] and all(.jobs[]; .conclusion == "success")' verified-jobs.json
          test "$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.tag_name == "v0.1.4")] | length')" = 0
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq 'length')" = 0
          mkdir -p release
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir release
          printf '%s  FlowGesture-macos.dmg\n' "$DMG_SHA256" > release/SHA256SUMS.txt
          (cd release && shasum -a 256 -c SHA256SUMS.txt)
      - name: Verify exact release image version, installation and launch
        run: |
          MOUNT="$(mktemp -d -t flowgesture-release-version)"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rmdir "$MOUNT" 2>/dev/null || true' EXIT
          hdiutil attach release/FlowGesture-macos.dmg -readonly -nobrowse -mountpoint "$MOUNT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MOUNT/FlowGesture.app/Contents/Info.plist")" = "${VERSION#v}"
          hdiutil detach "$MOUNT"
          rmdir "$MOUNT"
          trap - EXIT
          bash scripts/verify-dmg.sh release/FlowGesture-macos.dmg
      - name: Create draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 行云手势 0.1.4
          - 修复切换应用后首次触控手势丢失，改善快速多指手势识别和设备启动失败后的恢复。
          - 修复 Intel 上自由形状预览崩溃，以及小屏幕上保存按钮不可见的问题。

          ## FlowGesture 0.1.4
          - Fix the first touch gesture being lost after switching apps; improve quick multi-finger recognition and recovery from device-start failures.
          - Fix the Intel free-form preview crash and keep Save accessible on small displays.
          NOTES
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$TARGET" > /dev/null
          gh release create "$VERSION" release/FlowGesture-macos.dmg release/SHA256SUMS.txt --repo "$GH_REPO" --target "$TARGET" --verify-tag --title 'FlowGesture 0.1.4 · 行云手势' --notes-file release-notes.md --draft
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)" = "$TARGET"
          mkdir -p release-download
          gh release download "$VERSION" --repo "$GH_REPO" --dir release-download --pattern FlowGesture-macos.dmg --pattern SHA256SUMS.txt
          (cd release-download && shasum -a 256 -c SHA256SUMS.txt)
          cmp release/FlowGesture-macos.dmg release-download/FlowGesture-macos.dmg
          cmp release/SHA256SUMS.txt release-download/SHA256SUMS.txt
          gh release edit "$VERSION" --repo "$GH_REPO" --draft=false --latest
          gh release view "$VERSION" --repo "$GH_REPO" --json url,isDraft,tagName,assets
