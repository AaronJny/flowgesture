name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Native bridge tests
        run: bash scripts/test-native-bridge.sh
      - name: Test
        run: swift test
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Launch smoke test
        run: bash scripts/smoke-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FlowGesture-macos
          path: build/FlowGesture-macos.zip
          if-no-files-found: error
