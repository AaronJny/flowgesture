name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      quartz_replay:
        description: Run the opt-in public Quartz transport probe (not physical gesture validation)
        type: boolean
        required: false
        default: false
      dock_smoke:
        description: Run synthetic Spaces/Dock smoke on disposable hosted desktops (not physical gesture validation)
        type: boolean
        required: false
        default: false
concurrency:
  group: flowgesture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Native bridge tests
        run: bash scripts/test-native-bridge.sh
      - name: Test
        run: swift test
      - name: Test passive collector serialization without hardware
        run: bash scripts/test-passive-capture.sh
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Package passive collector without live capture
        run: bash scripts/package-passive-capture.sh
      - name: Launch smoke test
        run: bash scripts/smoke-test-app.sh
      - name: Render rule editor for visual review
        run: |
          mkdir -p build/ui-review
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/rule-editor.png"
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/scrolling.png" --ui-review-scrolling
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/manual-shortcut.png" --ui-review-manual-shortcut
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/draw-capture.png" --ui-review-draw
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/shape-capture.png" --ui-review-shape
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/touch-trackpad-zh.png" --ui-review-touch
          build/FlowGesture.app/Contents/MacOS/FlowGesture --ui-review-screenshot "$PWD/build/ui-review/touch-mouse-en.png" --ui-review-touch-mouse --ui-review-english
      - name: Test mappings while FlowGesture is foreground
        run: build/FlowGesture.app/Contents/MacOS/FlowGesture --foreground-rule-smoke
      - name: Test diagonal gesture toggles real full screen
        run: build/FlowGesture.app/Contents/MacOS/FlowGesture --fullscreen-rule-smoke
      - name: Test native shortcut capture pipeline
        run: build/FlowGesture.app/Contents/MacOS/FlowGesture --shortcut-capture-smoke
      - name: Test actual shortcut record and save UI
        run: build/FlowGesture.app/Contents/MacOS/FlowGesture --shortcut-ui-smoke
      - name: Test mouse capture and save in all trigger editors
        run: |
          for mode in click draw shape; do
            build/FlowGesture.app/Contents/MacOS/FlowGesture --mouse-capture-ui-smoke "$mode"
          done
      - name: Verify install image
        run: bash scripts/verify-dmg.sh build/FlowGesture-macos.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: FlowGesture-macos-${{ matrix.os }}
          path: build/FlowGesture-macos.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Download uploaded install image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FlowGesture-macos-${{ matrix.os }}
          path: downloaded
      - name: Verify downloaded install image
        run: |
          cmp build/FlowGesture-macos.dmg downloaded/FlowGesture-macos.dmg
          bash scripts/verify-dmg.sh downloaded/FlowGesture-macos.dmg
      - name: Upload UI review image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FlowGesture-ui-review-${{ matrix.os }}
          path: build/ui-review/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload passive collector test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: FlowGesture-passive-capture-${{ matrix.os }}
          path: build/capture-tool/*
          if-no-files-found: error
          retention-days: 7

  quartz-replay:
    # Explicit isolated-branch opt-in. Ordinary branches/main never post fixtures.
    if: (github.event_name == 'workflow_dispatch' && inputs.quartz_replay) || (github.event_name == 'push' && github.ref == 'refs/heads/dot/touch-compatibility-20261108')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Live public Quartz transport and admission probe
        env:
          FLOWGESTURE_RUN_QUARTZ_REPLAY: '1'
        run: bash scripts/test-quartz-replay.sh
      - name: Observe passive capture capability without physical-input claims
        if: always()
        env:
          FLOWGESTURE_RUN_CAPTURE_CAPABILITY: '1'
        run: bash scripts/probe-passive-capture-capability.sh
      - name: Test read-only console diagnostic without hardware
        if: always()
        run: bash scripts/test-console-session-probe.sh
      - name: Observe current runner console-state fields
        if: always()
        env:
          FLOWGESTURE_RUN_CONSOLE_SESSION_PROBE: '1'
          FLOWGESTURE_PROBE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p build/console-session-probe
          swift scripts/probe-console-session.swift --probe > build/console-session-probe/report.json
      - name: Upload bounded current-session diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FlowGesture-console-session-probe-${{ matrix.os }}
          path: build/console-session-probe/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload passive capability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FlowGesture-capture-capability-${{ matrix.os }}
          path: build/capture-capability/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload bounded synthetic replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FlowGesture-quartz-replay-${{ matrix.os }}
          path: build/quartz-replay/report.json
          if-no-files-found: warn
          retention-days: 7

  dock-smoke:
    # A dedicated disposable desktop: never share a runner with app/Quartz jobs.
    # Failure may leave a private Dock animation incomplete; end the job rather
    # than repairing/reusing that session. No self-hosted runners are allowed.
    if: (github.event_name == 'workflow_dispatch' && inputs.dock_smoke) || (github.event_name == 'push' && github.ref == 'refs/heads/dot/touch-compatibility-20261108')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test synthetic Dock consumer on disposable hosted desktop
        env:
          FLOWGESTURE_RUN_DOCK_SMOKE: '1'
          FLOWGESTURE_DOCK_SMOKE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p build/dock-smoke
          export FLOWGESTURE_DOCK_SMOKE_REPORT="$PWD/build/dock-smoke/report.json"
          swift build --build-tests
          python3 - <<'PY'
          import os, signal, subprocess, sys
          command = ['swift', 'test', '--skip-build', '--filter', 'SyntheticDockConsumerSmokeTests/testOptInHostedDockConsumerSmoke']
          child = subprocess.Popen(command, start_new_session=True)
          try:
              sys.exit(child.wait(timeout=90))
          except subprocess.TimeoutExpired:
              print('FAIL: isolated synthetic Dock test exceeded 90 seconds; discard this runner session.', flush=True)
              os.killpg(child.pid, signal.SIGKILL)
              child.wait()
              sys.exit(124)
          PY
      - name: Upload bounded synthetic Dock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FlowGesture-dock-smoke-${{ matrix.os }}
          path: build/dock-smoke/report.json
          if-no-files-found: warn
          retention-days: 7
