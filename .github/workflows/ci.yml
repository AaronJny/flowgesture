name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: flowgesture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Native bridge tests
        run: bash scripts/test-native-bridge.sh
      - name: Test
        run: swift test
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Launch smoke test
        run: bash scripts/smoke-test-app.sh
      - name: Verify install image
        run: bash scripts/verify-dmg.sh build/FlowGesture-macos.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: FlowGesture-macos
          path: build/FlowGesture-macos.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Download uploaded install image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FlowGesture-macos
          path: downloaded
      - name: Verify downloaded install image
        run: |
          cmp build/FlowGesture-macos.dmg downloaded/FlowGesture-macos.dmg
          bash scripts/verify-dmg.sh downloaded/FlowGesture-macos.dmg
